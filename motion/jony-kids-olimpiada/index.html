// ===== JONY KIDS OLIMPIADASI — deterministic 2.5D timeline (vizavi-motion) =====
const W = 1920, H = 1080, F = 1000, DUR = 20;
const cv = document.getElementById('c'), out = cv.getContext('2d');

// ---------- utils ----------

// ---------- assets ----------
const IMG = {};

  'hand_yellow_open', 'hand_yellow_point', 'red_hand_open', 'blue_hand_open', 'green_hand_open', 'purple_hand_open', 'pink_hand_open',
  'face_a', 'face_c', 'face_i', 'face_l', 'face_h', 'face_b', 'shadow', 'tile_center', 'tile_left', 'tile_right', 'tile_grey', 'tile_exclamation',
  'tile_half_left', 'tile_half_center', 'tile_half_right', 'tile_background_tree_large', 'tile_background_tree_small', 'tile_coin', 'tile_cloud',
  'tile_background_grass'];
function loadImg(n) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[n] = i; res(); }; i.onerror = rej; i.src = 'img/' + n + '.png'; }); }

// ---------- camera ----------
// keys: [t, x, y, z, roll]; cubic Hermite with finite-difference tangents (no forced stops at keys)
function camAt(keys, t) {

}
// Outdoor camera (S1-S3)
const CAM_A = [
  [0.0, -520, -250, 430, -0.065],
  [1.2, -300, -320, 170, -0.025],
  [2.4, -90, -345, 10, 0.0],
  [3.4, 10, -350, -55, 0.006],
  [3.78, 900, -520, -90, 0.02],
  [4.15, 1750, -640, -150, 0.032],
  [5.2, 2200, -780, -150, 0.026],

  [7.35, 3050, -980, -60, 0.006],
  [7.85, 4050, -1260, -20, 0.0],
  [8.4, 4240, -1300, 20, -0.006],
  [9.6, 4300, -1295, -10, -0.01],
  [11.0, 4290, -1290, 60, -0.004],
  [11.42, 4130, -1272, 260, 0.0],
  [11.72, 3960, -1262, 700, 0.0],
  [11.9, 3950, -1260, 895, 0.0],
  [12.0, 3950, -1260, 905, 0.0],
];
// Stage camera (S4)
const CAM_B = [
  [11.0, -640, -430, 210, 0.0],
  [12.0, -640, -430, 210, -0.012],
  [12.9, -330, -400, 120, -0.02],
  [13.6, 430, -390, 140, 0.015],

  [16.0, -40, 560, -150, 0.0],
];
// Final outdoor location camera (S5)
const CAM_C = [
  [16.0, 10000, -1750, -110, 0.0],
  [16.55, 10010, -560, -70, 0.0],
  [17.4, 10020, -440, -30, 0.006],
  [18.6, 10030, -430, 0, 0.002],

// ---------- renderer with depth list, DOF, soft shadow ----------
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, ctx: c.getContext('2d') }; };
const LAY = mk(W, H), HALF = mk(W / 2, H / 2);
class R3 {

  setCam(c, focusZ = 1000, dofK = 5) { this.cx = c[0]; this.cy = c[1]; this.cz = c[2]; this.roll = c[3]; this.fz = focusZ; this.dofK = dofK; this.items.length = 0; }

  add(z, fn, blur = 0) { this.items.push({ z, fn, blur }); }

  at(x, y, z, fn, o = {}) {
    const bl = (o.blur != null ? o.blur : this.blurAt(z)) + (o.extraBlur || 0);

      const p = this.proj(x, y, z); if (p.d < 25) return;
      if (o.cull !== false) { const m = (o.r || 1400) * p.s; if (p.x < -m || p.x > W + m || p.y < -m || p.y > H + m) return; }

// ---------- text ----------
const mCache = {};

  ctx.font = font; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const tw = measure(ctx, str, font), n = str.length;

    for (let i = 0; i < n; i++) {
      const ch = str[i]; if (ch === ' ') continue;
      const x0 = measure(ctx, str.slice(0, i), font) - tw / 2, cw = measure(ctx, ch, font);
      const a = o.anim ? o.anim(i, n) : {}; if ((a.alpha ?? 1) <= 0.002 || (a.sc ?? 1) <= 0.001) continue;
      ctx.save();

      ctx.rotate(a.rot || 0); const sc = a.sc ?? 1; ctx.scale(sc * (a.sx || 1), sc * (a.sy || 1));

        ctx.strokeStyle = o.deep || '#1b2357'; ctx.lineWidth = lw; ctx.fillStyle = o.deep || '#1b2357';
        ctx.strokeText(ch, -cw / 2, size * .33 + ext); ctx.fillText(ch, -cw / 2, size * .33 + ext);
      } else if (pass === 1) {
        ctx.strokeStyle = o.stroke || '#1b2357'; ctx.lineWidth = lw; ctx.strokeText(ch, -cw / 2, size * .33);
      } else {

        ctx.fillText(ch, -cw / 2, size * .33);

// ---------- environment ----------
function sky(ctx, cy, warm = 0) {

  g.addColorStop(.62, `hsl(${200 - warm * 15},85%,${76 - k * 6}%)`);
  g.addColorStop(1, `hsl(${48 * warm + 195 * (1 - warm)},90%,${88}%)`);

  r.addColorStop(0, 'rgba(255,250,220,0.55)'); r.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}
function cloudShape(ctx, w, seed) {

}
const ENV = (() => {
  const r = rng(7), hills = [], clouds = [], trees = [], fg = [];

  for (let x = -3000; x < 14000; x += 900 + r() * 900) clouds.push({ x, y: -1300 - r() * 1700, z: 2300 + r() * 1300, w: 900 + r() * 700, s: (r() * 1e6) | 0, a: .75 + r() * .2 });
  for (let x = -2500; x < 12500; x += 300 + r() * 380) trees.push({ x, z: 1600 + r() * 600, big: r() < .55, sc: 2.2 + r() * .9 });
  for (let i = 0; i < 26; i++) fg.push({ x: -1500 + i * 520 + r() * 300, y: -200 - r() * 1600, z: 300 + r() * 260, w: 420 + r() * 300, s: (r() * 1e6) | 0 });
  return { hills, clouds, trees, fg };
})();
function drawEnv(R, t, opt = {}) {
  for (const h of ENV.hills) R.at(h.x, 0, h.z, (ctx) => { ctx.fillStyle = h.c; ctx.beginPath(); ctx.ellipse(0, 300, h.rx, h.ry + 300, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-h.rx, 300, h.rx * 2, 1400); }, { r: 5000 });

}
function groundRow(R, x0, x1, y, z, deep = 3) {
  const n = Math.round((x1 - x0) / 160);
  for (let i = 0; i < n; i++) {
    const x = x0 + i * 160 + 80; const img = i === 0 ? IMG.tile_left : i === n - 1 ? IMG.tile_right : IMG.tile_center;
    R.sprite(img, x, y + 160, z, 162, 162, { r: 300 });

function slab(R, cx, y, z, tiles = 2) {
  for (let i = 0; i < tiles; i++) { const img = i === 0 ? IMG.tile_half_left : i === tiles - 1 ? IMG.tile_half_right : IMG.tile_half_center; R.sprite(img, cx + (i - (tiles - 1) / 2) * 160, y + 80, z, 162, 82, { r: 300, shadow: true, shadowY: 40, shadowBlur: 40 }); }
}

// ---------- characters ----------
function charDraw(R, c) {
  // c: {body, hand, face, x, y(ground), z, h(height above ground), sq(squash), rot, size, handsUp(0..1), wave, hold}
  const size = c.size || 150;
  // contact shadow on ground
  const sh = clamp(1 - c.h / 500, .25, 1);
  R.sprite(IMG.shadow, c.x, c.y + 6, c.z + 2, 110 * sh * size / 150, 40 * sh * size / 150, { ay: .5, alpha: .55 * sh, r: 200 });

    const sq = c.sq ?? 1; ctx.rotate(c.rot || 0); ctx.scale(1 / Math.sqrt(sq), sq);

    for (const sgn of [-1, 1]) {

    }

// hop between two points; returns {x,y,h,sq}
function hopState(t, t0, dur, p0, p1, arc = 140) {

  if (t < t0) { const u = (t - (t0 - pre)) / pre; return { x: p0[0], y: p0[1], h: 0, sq: 1 - .16 * Math.sin(u * Math.PI / 2) }; }

// ---------- props ----------
function giftBox(ctx, s, col, rib) {

  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-s * .56, -s * .98, s * 1.12, s * .24, s * .06); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.roundRect(-s * .56, -s * .98, s * 1.12, s * .08, s * .04); ctx.fill();

      word(c2, 'BARCHA ISHTIROKCHILARGA', 78, { family: 'Baloo', fill: '#ffffff', lw: .16, anim: (i, n) => { const td = 9.3 + i * .018; const s = spring(t - td, 15, .45); return { sc: Math.max(0, s), dy: (1 - s) * 40, alpha: clamp((t - td) * 10) }; } });
    }, { r: 2000 });
    R.at(DOOR_X + 720, -1420, 1035, (c2) => {
      word(c2, 'SOVG‘ALAR!', 190, { fill: ['#ffd23f'], grad: ['#fff27a', '#ffb21e'], shine: true, anim: (i, n) => { const td = 9.7 + i * .045; const s = spring(t - td, 14, .3); return { sc: Math.max(0, s), rot: wob(t - td, 10, 3) * .22 * (i % 2 ? 1 : -1), dy: Math.sin(t * 5 + i * .7) * 8 * clamp(t - td) }; } });
    }, { r: 2000 });
    confetti(R, t, 9.55, 70, DOOR_X, TOP_Y - 300, 980, 11, 1.2);
  }
  // knock rings
  if (t > 8.05 && t < 8.85) for (const kt of [8.12, 8.37]) { const u = seg(t, kt, kt + .35); if (u > 0 && u < 1) R.at(DOOR_X - 120, TOP_Y - 250, 999, (c2) => { c2.strokeStyle = '#ffffff'; c2.lineWidth = 8; c2.globalAlpha = 1 - u; for (let k = 0; k < 3; k++) { const a = -2.6 + k * .5; c2.beginPath(); c2.moveTo(Math.cos(a) * 60 * (1 + u), Math.sin(a) * 60 * (1 + u)); c2.lineTo(Math.cos(a) * 100 * (1 + u), Math.sin(a) * 100 * (1 + u)); c2.stroke(); } }, { r: 200 }); }
  R.flush();
}

function stage(ctx, t) {
  const tc = Math.max(t, 11.0);
  const cam = camAt(CAM_B, tc);
  const R = new R3(ctx); R.setCam(cam, 1000, 5);
  // back wall gradient
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a1f78'); g.addColorStop(.7, '#4b33b8'); g.addColorStop(1, '#6a4fe0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // back wall pattern: stars/dots on far plane
  const r = rng(3);
  for (let i = 0; i < 90; i++) { const x = -3200 + r() * 6400, y = -2400 + r() * 2300, z = 2600 + r() * 600, s = 10 + r() * 22, tw = .5 + .5 * Math.sin(t * 3 + i);
    R.at(x, y, z, (c2) => { c2.fillStyle = `rgba(255,236,170,${.35 + .4 * tw})`; c2.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? s * .4 : s; c2.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c2.fill(); }, { r: 60 }); }
  // big back title
  R.at(0, -1130, 1900, (c2) => { word(c2, 'KATTA MUKOFOTLAR', 190, { fill: '#ffffff', grad: ['#ffffff', '#ffe58a'], lw: .14, deep: '#170f4a', stroke: '#170f4a', anim: (i) => { const td = 12.05 + i * .03; const s = spring(t - td, 12, .45); return { sc: Math.max(0, s), alpha: clamp((t - td) * 6) }; } }); }, { r: 3000 });
  // curtains (mid-far)
  for (const s of [-1, 1]) R.at(s * 1650, -1500, 1500, (c2) => { const cg = c2.createLinearGradient(-300, 0, 300, 0); cg.addColorStop(0, '#b0213f'); cg.addColorStop(.5, '#e2405c'); cg.addColorStop(1, '#9c1a36'); c2.fillStyle = cg; c2.beginPath(); c2.moveTo(-420, 0); c2.lineTo(420, 0); c2.quadraticCurveTo(200 + Math.sin(t) * 20, 900, 360 * -s * 0 + 120 * s, 1600); c2.lineTo(-420 * 1, 1600); c2.closePath(); c2.fill(); for (let k = -3; k <= 3; k++) { c2.fillStyle = 'rgba(0,0,0,0.12)'; c2.fillRect(k * 110 - 8, 0, 16, 1600); } }, { r: 3000 });
  // floor plane (true perspective)
  R.add(5000, (c2) => {
    const pts = [[-6000, 0, 3000], [6000, 0, 3000], [6000, 0, cam[2] + 60], [-6000, 0, cam[2] + 60]].map(p => R.proj(...p));
    const fg = c2.createLinearGradient(0, pts[0].y, 0, H + 200); fg.addColorStop(0, '#5a3fc9'); fg.addColorStop(1, '#8e6bff');
    c2.fillStyle = fg; c2.beginPath(); pts.forEach((p, i) => i ? c2.lineTo(p.x, p.y) : c2.moveTo(p.x, p.y)); c2.fill();
    // floor rings
    c2.strokeStyle = 'rgba(255,255,255,0.10)'; c2.lineWidth = 3;
    for (let zz = 700; zz < 3000; zz += 260) { const a = R.proj(-6000, 0, zz), b = R.proj(6000, 0, zz); if (a.d > 0) { c2.beginPath(); c2.moveTo(a.x, a.y); c2.lineTo(b.x, b.y); c2.stroke(); } }
  });
  // spotlights (additive cones from above)
  R.add(1400, (c2) => {
    c2.save(); c2.globalCompositeOperation = 'lighter';
    const tg = [[-620, 950, 12.2], [620, 950, 13.2], [0, 1150, 14.2]];
    for (const [x, z, on] of tg) {
      const a = clamp((t - on) * 4) * .5 + .12; const top = R.proj(x + (x ? -x * .3 : 0), -2200, z), b0 = R.proj(x - 260, 0, z), b1 = R.proj(x + 260, 0, z);
      const lg = c2.createLinearGradient(0, top.y, 0, b0.y); lg.addColorStop(0, `rgba(255,240,200,0)`); lg.addColorStop(1, `rgba(255,235,180,${a})`);
      c2.fillStyle = lg; c2.beginPath(); c2.moveTo(top.x - 20, top.y); c2.lineTo(top.x + 20, top.y); c2.lineTo(b1.x, b1.y); c2.lineTo(b0.x, b0.y); c2.fill();
      const pool = R.proj(x, 0, z); c2.fillStyle = `rgba(255,235,180,${a * .6})`; c2.beginPath(); c2.ellipse(pool.x, pool.y, 300 * pool.s, 60 * pool.s, 0, 0, 7); c2.fill();
    }
    c2.restore();
  });
  // podiums
  const pods = [{ x: -620, z: 950, h: 170, c: '#3ec1ff', n: '2' }, { x: 0, z: 1150, h: 300, c: '#ffd23f', n: '1' }, { x: 620, z: 950, h: 170, c: '#ff5a6e', n: '3' }];
  for (const p of pods) R.at(p.x, 0, p.z, (c2) => {
    const w = 420; c2.fillStyle = p.c; c2.beginPath(); c2.roundRect(-w / 2, -p.h, w, p.h, 18); c2.fill();
    c2.fillStyle = 'rgba(255,255,255,0.35)'; c2.beginPath(); c2.ellipse(0, -p.h, w / 2, 34, 0, 0, 7); c2.fill();
    c2.fillStyle = 'rgba(0,0,0,0.12)'; c2.fillRect(-w / 2, -p.h + 20, w, 14);
  }, { shadow: true, shadowY: 26, shadowBlur: 50, r: 800 });
  // prizes
  // bicycle — drop with bounce
  { const td = 12.18, u = t - td; if (u > 0) { const fall = clamp(u / .32); const y = -170 - (1 - eInCubic(fall)) * 900 - (u > .32 ? Math.abs(wob(u - .32, 16, 6)) * 70 : 0);
      R.at(-620, y, 948, (c2) => { c2.scale(1.05, 1.05); bicycle(c2, t * 3, '#ff7a1a'); }, { shadow: true, shadowY: 20, shadowBlur: 36, r: 500 }); } }
  // ball — bounces in from the right
  { const td = 13.13, u = t - td; if (u > 0) { const x = 620 + 700 * Math.max(0, 1 - u / .55) ** 1.5; let y; if (u < .55) { const v = u / .55; y = -170 - 100 - Math.abs(Math.sin(v * Math.PI * 1.5)) * 380 * (1 - v * .4); } else y = -170 - 100 - Math.abs(wob(u - .55, 14, 5)) * 160;
      R.at(x, y, 948, (c2) => { soccer(c2, 100, -u * 9 * Math.exp(-u * 1.2)); }, { shadow: true, shadowY: 24, shadowBlur: 40, r: 300 }); } }
  // phone — rises with glow
  { const td = 14.2, u = t - td; if (u > 0) { const s = spring(u, 11, .4); const y = -300 - 20 - s * 30 + Math.sin(t * 2.4) * 10;
      R.at(0, y, 1148, (c2) => {
        c2.save(); c2.globalCompositeOperation = 'lighter'; const gr = c2.createRadialGradient(0, -200, 0, 0, -200, 420); gr.addColorStop(0, `rgba(255,220,140,${.6 * clamp(u * 3)})`); gr.addColorStop(1, 'rgba(255,220,140,0)'); c2.fillStyle = gr; c2.fillRect(-500, -700, 1000, 1000); c2.restore();
        c2.rotate(wob(u, 9, 3) * .15 - .06); c2.scale(Math.max(0, s), Math.max(0, s)); phone(c2, clamp(u / 1.2)); }, { shadow: true, shadowY: 26, shadowBlur: 50, r: 500 }); } }
  // labels (anchored to podium fronts)
  const lab = (x, z, y, txt, td, size, col) => R.at(x, y, z - 30, (c2) => { const s = spring(t - td, 15, .4); if (t < td) return; c2.scale(Math.max(0, s), Math.max(0, s));
    c2.save(); c2.shadowColor = 'rgba(10,10,40,.4)'; c2.shadowBlur = 30; c2.shadowOffsetY = 14; const tw = measure(c2, txt, `800 ${size}px Baloo`); pill(c2, tw + 90, size * 1.35, size * .67, '#ffffff'); c2.restore();
    pill(c2, tw + 70, size * 1.15, size * .57, col);
    word(c2, txt, size, { fill: '#ffffff', lw: .12, ext: .05, deep: 'rgba(0,0,0,0.25)', stroke: 'rgba(0,0,0,0.0)' }); }, { r: 800 });
  lab(-620, 950, -60, 'VELOSIPED', 12.5, 82, '#1e8fd6');
  lab(620, 950, -60, 'KOPTOK', 13.5, 82, '#e33b55');
  lab(0, 1150, -110, 'IPHONE 17 PRO MAX', 14.5, 82, '#e09100');
  // foreground sparkles/confetti
  confetti(R, t, 14.35, 80, 0, -700, 900, 21, 1.4);
  for (let i = 0; i < 14; i++) { const rr = rng(100 + i); const x = -1800 + rr() * 3600, y = -1200 + rr() * 1100, z = 420 + rr() * 200;
    R.at(x + Math.sin(t + i) * 30, y, z, (c2) => { c2.fillStyle = 'rgba(255,230,150,0.75)'; c2.beginPath(); c2.arc(0, 0, 26, 0, 7); c2.fill(); }, { r: 80, extraBlur: 3 }); }
  R.flush();
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,40,0.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function finale(ctx, t) {
  const cam = camAt(CAM_C, t);
  const R = new R3(ctx); R.setCam(cam, 1000, 5);
  sky(ctx, cam[1], .1);
  drawEnv(R, t, { fg: true });
  groundRow(R, 8400, 11600, 0, 1000, 3);
  for (let i = 0; i < 8; i++) R.sprite(IMG.tile_background_grass, 8600 + i * 380, 2, 996, 90, 50, { r: 200 });
  const X = 10000;
  // sign drops on ropes, damped pendulum swing
  const td = 16.08, u = t - td;
  const drop = u < 0 ? -1400 : -1400 * (1 - spring(u, 9, .42));
  const ang = u > 0 ? wob(u, 6.5, 1.4) * .11 : 0;
  const SY = -600 + drop; // sign center
  const pivotY = SY - 900;
  R.at(X, pivotY, 1000, (c2) => {
    c2.rotate(ang);
    c2.strokeStyle = '#7a5230'; c2.lineWidth = 12; for (const s of [-1, 1]) { c2.beginPath(); c2.moveTo(s * 360, -1200); c2.lineTo(s * 400, 900 - 190); c2.stroke(); }
    c2.translate(0, 900);
    c2.save(); c2.shadowColor = 'rgba(18,30,90,0.35)'; c2.shadowBlur = 60; c2.shadowOffsetY = 34;
    c2.fillStyle = '#ffb21e'; c2.beginPath(); c2.roundRect(-600, -210, 1200, 420, 44); c2.fill(); c2.restore();
    c2.fillStyle = '#ffd23f'; c2.beginPath(); c2.roundRect(-600, -210, 1200, 120, [44, 44, 0, 0]); c2.fill();
    c2.fillStyle = '#fff6d0'; c2.beginPath(); c2.roundRect(-560, -70, 1120, 250, 30); c2.fill();
    for (const s of [-1, 1]) { c2.fillStyle = '#d98a00'; c2.beginPath(); c2.arc(s * 400, -175, 16, 0, 7); c2.fill(); }
    c2.save(); c2.translate(0, -148); word(c2, 'ATIGI', 92, { fill: '#ffffff', lw: .16, deep: '#8a4b00', stroke: '#8a4b00', anim: (i) => { const s = spring(t - 16.55 - i * .04, 16, .4); return { sc: Math.max(0, s) }; } }); c2.restore();
    c2.save(); c2.translate(0, 58); word(c2, '25 000 SO‘M', 196, { fill: ['#ff5a2e'], grad: ['#ff9a3c', '#e8361e'], lw: .12, ext: .06, anim: (i, n) => { const tt = 16.7 + i * .05; const s = spring(t - tt, 15, .32); return { sc: Math.max(0, s), dy: (1 - s) * -60, rot: wob(t - tt, 12, 4) * .2 * (i % 2 ? 1 : -1) }; } }); c2.restore();
  }, { r: 3000 });
  // crowd cheering at the sides
  const pos = [[-640, 1000], [-800, 990], [-480, 1004], [640, 1000], [800, 990], [480, 1004]];
  for (let j = 0; j < 6; j++) {
    const [dx, z] = pos[j]; const ph = j * .17; const jumpT = (t - 16.3 - ph);
    let h = 0, sq = 1; if (jumpT > 0) { const cyc = (jumpT % .5) / .5; h = Math.sin(cyc * Math.PI) * 70 * (t > 18.6 ? clamp((19.6 - t)) : 1); sq = 1 + .1 * Math.sin(cyc * Math.PI) - (cyc > .9 ? .1 : 0); }
    charDraw(R, { ...CAST[j], face: t > 16.75 ? 'face_l' : 'face_i', x: X + dx, y: 0, z, h, sq, size: 150, handsUp: clamp((t - 16.3 - ph) * 4) * .9, look: dx < 0 ? 1 : -1 });
  }
  // CTA
  const cu = t - 17.5;
  R.at(X, -265, 985, (c2) => {
    if (cu < 0) return; const s = spring(cu, 13, .45); const press = t > 18.5 && t < 18.7 ? 1 - .08 * Math.sin(seg(t, 18.5, 18.7) * Math.PI) : 1;
    const pulse = t > 18.7 ? 1 + .025 * Math.sin((t - 18.7) * 6) * Math.exp(-(t - 18.7) * .8) : 1;
    c2.translate(0, (1 - s) * 260); c2.scale(press * pulse, press * pulse); c2.globalAlpha = clamp(cu * 5);
    c2.save(); c2.shadowColor = 'rgba(18,30,90,0.4)'; c2.shadowBlur = 50; c2.shadowOffsetY = 26; pill(c2, 1180, 170, 85, '#1b2357'); c2.restore();
    pill(c2, 1150, 145, 72, '#ff8a1f'); c2.save(); c2.beginPath(); c2.roundRect(-575, -72, 1150, 145, 72); c2.clip(); c2.fillStyle = 'rgba(255,255,255,0.25)'; c2.fillRect(-600, -72, 1200, 60);
    // shine sweep
    const sw = seg(t, 18.85, 19.55); if (sw > 0 && sw < 1) { c2.fillStyle = 'rgba(255,255,255,0.45)'; c2.beginPath(); const sx = lerp(-800, 800, sw); c2.moveTo(sx - 60, -90); c2.lineTo(sx + 40, -90); c2.lineTo(sx - 40, 90); c2.lineTo(sx - 140, 90); c2.fill(); }
    c2.restore();
    word(c2, 'HOZIROQ RO‘YXATDAN O‘TING!', 74, { fill: '#ffffff', lw: .16, deep: '#8a3b00', stroke: '#8a3b00', ext: .05, anim: (i) => { const s = spring(cu - .15 - i * .012, 16, .5); return { sc: Math.max(0, s) }; } });
  }, { r: 2000 });
  // tapping hand
  { const hu = t - 18.0; if (hu > 0) { const tap = seg(t, 18.38, 18.5) - seg(t, 18.58, 18.78); const x = X + 470 + (1 - eOutCubic(clamp(hu / .4))) * 500, y = -155 + (1 - eOutCubic(clamp(hu / .4))) * 400 - (1 - tap) * 40;
      R.sprite(IMG.hand_yellow_point, x, y, 975, 130, 137, { ay: .1, ax: .1, rot: -0.15 + tap * .1, shadow: true, shadowY: 20, shadowBlur: 30, alpha: clamp(hu * 5), r: 300 });
      if (t > 18.5 && t < 19.0) { const v = seg(t, 18.5, 19.0); R.at(X + 470, -195, 974, (c2) => { c2.strokeStyle = '#fff'; c2.lineWidth = 10; c2.globalAlpha = 1 - v; c2.beginPath(); c2.arc(0, 0, 40 + 120 * eOutCubic(v), 0, 7); c2.stroke(); }, { r: 300 }); } } }
  // coins raining in the foreground (deep blur) + mid
  for (let i = 0; i < 18; i++) { const rr = rng(500 + i); const z = i < 6 ? 380 + rr() * 150 : 800 + rr() * 300; const st = 16.2 + rr() * 1.2; const u = t - st; if (u < 0) continue;
    const y = -1500 + u * (1100 + rr() * 300); if (y > 200) continue; const x = X - 1300 + rr() * 2600;
    R.sprite(IMG.tile_coin, x, y, z, 90 * Math.abs(Math.cos(u * 6 + i)) + 10, 90, { ay: .5, r: 200 }); }
  confetti(R, t, 16.65, 60, X, -900, 980, 31, 1.5);
  R.flush();
}

// ---------- frame composition ----------
function drawScene(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  if (t < 11.87) {
    if (t > 8.7) stage(gctx, t);
    outdoor(ctx, t);
  } else if (t < 16) { stage(ctx, t); }
  else finale(ctx, t);
  // global grade: subtle vignette + grain-free bloom-ish top light
  const vg = ctx.createRadialGradient(W / 2, H * .45, H * .5, W / 2, H / 2, H * 1.1); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,10,40,0.28)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
// render frame i with K subframe samples over a 180° shutter
window.renderFrame = function (i, fps = 60, K = 5) {
  const t0 = i / fps; out.setTransform(1, 0, 0, 1, 0, 0);
  for (let k = 0; k < K; k++) {
    const t = Math.min(DUR - 1e-4, Math.max(0, t0 + (K === 1 ? 0 : (k / (K - 1) - .5) * .5 / fps)));
    if (K === 1) { drawScene(out, t); break; }
    sctx.clearRect(0, 0, W, H); drawScene(sctx, t);
    out.globalAlpha = 1 / (k + 1); out.drawImage(scr, 0, 0);
  }
  out.globalAlpha = 1;
};
window.renderAt = (t) => { drawScene(out, t); };
</script>
