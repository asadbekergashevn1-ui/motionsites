  else { setBg('#ffffff', '#e3f6fc'); scene.fog.color.set(0xeaf7fb); floorMat.color.set(0xf4fbfd); }

      const sq = land > 0 ? 1 - .22 * wob(land, 22, 7) : 1; const out = eIn(seg(t, 3.45 + i * .03, 3.85 + i * .03)); l.scale.set(1 / Math.sqrt(sq), sq * (1 - out) + .001, 1); if (out > .97) l.visible = false; l.position.y -= out * .2; l.rotation.x -= out * .6;

  }

  if (s3) {
    const g = G.s3;
    const open = t < 8.55 ? .035 * seg(t, 8.0, 8.2) + 0.0 : clamp(spring(t - 8.55, 7, .55)) * 1.0 + .035;

    { const td = 13.13, u = t - td; g.ball.visible = u > 0; const xin = Math.max(0, 1 - u / .55) ** 1.5 * 1.6; let y;

// ---------- compositing: motion blur by subframe accumulation + light flashes ----------
const out = document.getElementById('out').getContext('2d');
function overlay(t) {
  // passing through the doorway light
  const a = Math.max(0, 1 - Math.abs(t - 11.97) / .2); if (a > 0) { out.fillStyle = `rgba(226,250,255,${(a * .95).toFixed(3)})`; out.fillRect(0, 0, W, H); }
}
window.renderFrame = (i, fps = 60, K = 3) => {
  const t0 = i / fps;
  if (K === 0) { const sp = camSpeed(t0); K = sp > 2.5 ? 4 : sp > 1.0 ? 3 : 2; }
  for (let k = 0; k < K; k++) {
    const t = Math.min(DUR - 1e-4, Math.max(0, t0 + (K === 1 ? 0 : (k / (K - 1) - .5) * .5 / fps)));
    update(t); renderer.render(scene, camera);
    out.globalAlpha = 1 / (k + 1); out.drawImage(gl, 0, 0);
  }
  out.globalAlpha = 1; overlay(t0);
};

const SP = 1024;
window.ready = (async () => { await loadFonts(); renderer.setSize(SP, SP, false); renderer.setClearColor(0x000000, 0); scene.background = null; scene.fog = null; floor.visible = false;
  key.shadow.mapSize.set(1024, 1024); return 'ok'; })().catch(e => 'ERR ' + e.stack);
const objs = {};
const cam2 = new THREE.PerspectiveCamera(26, 1, .05, 100);
window.spriteFrame = (name, k, n) => {
  if (!objs[name]) {
    const mk = { qm: () => { const g = questionMark(); g.scale.setScalar(.72); g.position.y = -.42; return g; }, medal: () => medal(), gift: () => { const g = gift(1); g.position.y = -.55; return g; },
      bike: () => { const g = bicycle(); g.position.set(0, -.6, 0); return g; }, ball: () => soccerBall(.6), phone: () => phone() }[name];
    const g = new THREE.Group(); g.add(mk()); objs[name] = g;
  }
  for (const o of Object.values(objs)) scene.remove(o);
  const g = objs[name]; scene.add(g);
  const a = k / n * Math.PI * 2;
  g.rotation.set(name === 'phone' ? -.12 : name === 'bike' ? .12 : .1, a, name === 'phone' ? .08 : 0);
  cam2.position.set(0, .35, 4.6); cam2.lookAt(0, 0, 0);
  key.position.set(-3, 6, 5); key.target.position.set(0, 0, 0); key.castShadow = false;
  renderer.render(scene, cam2); return gl.toDataURL('image/png');
};
