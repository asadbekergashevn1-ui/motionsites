<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; --mut:#8A919C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1000px; height:1000px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        padding:48px; display:flex; flex-direction:column; }
  .eyebrow{ font-size:15px; font-weight:800; letter-spacing:.28em; color:var(--mut); text-align:center; }
  h2{ font-size:52px; font-weight:800; letter-spacing:-.026em; line-height:1.02; text-align:center; margin-top:12px; }
  h2 em{ font-style:normal; color:var(--amber); }
  .lede{ text-align:center; font-size:21px; font-weight:600; color:var(--mut); margin-top:14px; line-height:1.4; }
  .sheet{ border:1.5px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;
          box-shadow:0 10px 26px rgba(27,42,65,.16); }
  .sheet img{ width:100%; display:block; }
  .badges{ display:flex; justify-content:center; gap:13px; margin-top:auto; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:11px 25px; font-size:19px; font-weight:800; }
  .bd.fill{ background:var(--navy); color:#fff; }
.r5{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}
.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:0 60px}
.rlab{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-align:center;margin:24px 0 11px}
.cap{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--mut);text-align:center;margin-top:8px}</style></head><body><div class="eyebrow">EVERYTHING YOU GET</div><h2>10 pages. <em>No filler.</em></h2>
<div class="rlab">THE 6 CORE PAGES</div><div class="r5"><div><div class="sheet"><img src="../exports/p1-start.png"></div><div class="cap">START HERE</div></div><div><div class="sheet"><img src="../exports/p2-today.png"></div><div class="cap">WHAT TO EAT TODAY</div></div><div><div class="sheet"><img src="../exports/p3-density.png"></div><div class="cap">DENSITY SCORE</div></div><div><div class="sheet"><img src="../exports/p4-doseweek.png"></div><div class="cap">DOSE WEEK</div></div><div><div class="sheet"><img src="../exports/p5-ladder.png"></div><div class="cap">TEXTURE LADDER</div></div><div><div class="sheet"><img src="../exports/p6-redflags.png"></div><div class="cap">RED FLAGS</div></div></div>
<div class="badges" style="margin-top:26px"><span class="bd fill">6 CORE PAGES</span><span class="bd">4 BONUSES</span></div></body></html>
