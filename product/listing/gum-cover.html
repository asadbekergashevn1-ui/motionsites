<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gumroad Cover</title><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1600px; height:900px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        display:flex; align-items:center; gap:52px; padding:0 66px; }
  .L{ width:640px; flex:none; }
  .nm1{ font-size:17px; font-weight:800; letter-spacing:.30em; color:#8A919C; }
  h1{ font-size:62px; font-weight:800; line-height:.98; letter-spacing:-.03em; margin-top:14px; }
  .kick{ font-size:25px; font-weight:700; color:var(--amber); font-style:italic; margin-top:16px; line-height:1.25; }
  .cmp{ display:flex; align-items:center; gap:16px; margin-top:28px; }
  .cbx{ width:188px; border-radius:13px; padding:12px 0 14px; text-align:center; }
  .off{ background:#F1F2F4; border:2.5px solid #D8DBE0; }
  .on{ background:#fff; border:3px solid var(--amber); }
  .mk{ font-size:26px; font-weight:800; line-height:1; }
  .mk.x{ color:var(--red); } .mk.v{ color:var(--green); }
  .cl{ font-size:21px; font-weight:800; letter-spacing:-.01em; margin-top:6px; }
  .off .cl{ color:#8A919C; }
  .arr{ font-size:33px; font-weight:800; }
  .badges{ display:flex; gap:11px; margin-top:32px; flex-wrap:wrap; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:10px 22px;
       font-size:17px; font-weight:800; letter-spacing:.03em; }
  .bd.fill{ background:var(--navy); color:#fff; }
  .R{ flex:1; display:flex; align-items:center; justify-content:center; gap:15px; }
  .pg{ width:184px; border:1.5px solid var(--line); border-radius:7px; overflow:hidden;
       box-shadow:0 9px 22px rgba(27,42,65,.15); background:#fff; }
  .pg img{ width:100%; display:block; }
  .pg.mid{ width:224px; box-shadow:0 13px 30px rgba(27,42,65,.22); }
</style></head><body>
  <div class="L">
    <div class="nm1">GLP-1</div>
    <h1>LOW APPETITE<br>PROTEIN PLAN</h1>
    <div class="kick">Hit your protein target<br>in the space you actually have.</div>
    <div class="cmp">
      <div class="cbx off"><div class="mk x">&#10007;</div><div class="cl">FIBER FIRST</div></div>
      <div class="arr">&rarr;</div>
      <div class="cbx on"><div class="mk v">&#10003;</div><div class="cl">PROTEIN FIRST</div></div>
    </div>
    <div class="badges">
      <span class="bd fill">10 PAGES</span>
      <span class="bd">A4 + US LETTER</span>
      <span class="bd">INSTANT PDF</span>
    </div>
  </div>
  <div class="R">
    <div class="pg"><img src="../exports/p1-start.png"></div>
    <div class="pg mid"><img src="../exports/p2-today.png"></div>
    <div class="pg"><img src="../exports/p3-density.png"></div>
  </div>
</body></html>
