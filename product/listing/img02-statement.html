<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; --mut:#8A919C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1000px; height:1000px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        padding:48px; display:flex; flex-direction:column; }
  .eyebrow{ font-size:15px; font-weight:800; letter-spacing:.28em; color:var(--mut); text-align:center; }
  h2{ font-size:52px; font-weight:800; letter-spacing:-.026em; line-height:1.02; text-align:center; margin-top:12px; }
  h2 em{ font-style:normal; color:var(--amber); }
  .lede{ text-align:center; font-size:21px; font-weight:600; color:var(--mut); margin-top:14px; line-height:1.4; }
  .sheet{ border:1.5px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;
          box-shadow:0 10px 26px rgba(27,42,65,.16); }
  .sheet img{ width:100%; display:block; }
  .badges{ display:flex; justify-content:center; gap:13px; margin-top:auto; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:11px 25px; font-size:19px; font-weight:800; }
  .bd.fill{ background:var(--navy); color:#fff; }
</style></head><body>
<div style="margin:auto 0">
<h2 style="font-size:70px">MOST GLP-1 MEAL PLANS<br>FILL YOU UP FIRST</h2>
<div style="text-align:center;font-size:27px;font-weight:700;color:var(--amber);margin-top:16px;font-style:italic">Your stomach can't afford that.</div>
<div style="display:flex;align-items:center;justify-content:center;gap:26px;margin-top:46px">
  <div style="width:268px;background:#F1F2F4;border:2.5px solid #D8DBE0;border-radius:16px;padding:22px 0 24px;text-align:center">
    <div style="font-size:38px;font-weight:800;color:var(--red);line-height:1">&#10007;</div>
    <div style="font-size:29px;font-weight:800;color:#8A919C;margin-top:10px">FIBER FIRST</div></div>
  <div style="font-size:46px;font-weight:800">&rarr;</div>
  <div style="width:268px;background:#fff;border:3px solid var(--amber);border-radius:16px;padding:22px 0 24px;text-align:center">
    <div style="font-size:38px;font-weight:800;color:var(--green);line-height:1">&#10003;</div>
    <div style="font-size:29px;font-weight:800;margin-top:10px">PROTEIN FIRST</div></div>
</div>
<div style="text-align:center;font-size:20px;font-weight:600;color:var(--mut);margin-top:42px;line-height:1.5">
  Fibre first is good advice &mdash; for someone <b style="color:var(--navy)">not</b> on the drug.<br>
  On a GLP-1 it spends the little room you have and hands back two grams.</div>
</div>
<div class="badges"><span class="bd fill">PROTEIN</span><span class="bd">DENSITY</span><span class="bd">DOSE WEEK</span></div>
</body></html>
