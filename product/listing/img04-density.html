<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; --mut:#8A919C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1000px; height:1000px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        padding:48px; display:flex; flex-direction:column; }
  .eyebrow{ font-size:15px; font-weight:800; letter-spacing:.28em; color:var(--mut); text-align:center; }
  h2{ font-size:52px; font-weight:800; letter-spacing:-.026em; line-height:1.02; text-align:center; margin-top:12px; }
  h2 em{ font-style:normal; color:var(--amber); }
  .lede{ text-align:center; font-size:21px; font-weight:600; color:var(--mut); margin-top:14px; line-height:1.4; }
  .sheet{ border:1.5px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;
          box-shadow:0 10px 26px rgba(27,42,65,.16); }
  .sheet img{ width:100%; display:block; }
  .badges{ display:flex; justify-content:center; gap:13px; margin-top:auto; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:11px 25px; font-size:19px; font-weight:800; }
  .bd.fill{ background:var(--navy); color:#fff; }

.row{display:grid;grid-template-columns:426px 1fr;gap:38px;align-items:center;margin-top:30px;flex:1}
.pts{list-style:none}
.pts li{display:flex;gap:14px;align-items:flex-start;margin-bottom:24px}
.pts .n{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#fff;font-size:15px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.pts li span:last-child{font-size:19px;line-height:1.45;font-weight:500}
.pts b{font-weight:800}</style></head><body><div class="eyebrow">PAGE 3</div><h2>The <em>density</em> page</h2>
<div class="row"><div class="sheet"><img src="../exports/p3-density.png"></div><ul class="pts"><li><span class="n">1</span><span><b>100 ml of chicken carries 18 g.</b> The same 18 g from broccoli takes five cups.</span></li><li><span class="n">2</span><span>Every number calculated from <b>USDA FoodData Central</b> &mdash; not rounded off a blog.</span></li><li><span class="n">3</span><span>A last column tells you <b>how much you would actually have to eat</b> to reach 20 g.</span></li></ul></div>
<div class="badges"><span class="bd fill">USDA-VERIFIED</span></div></body></html>
