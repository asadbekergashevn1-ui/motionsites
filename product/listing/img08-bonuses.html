<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; --mut:#8A919C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1000px; height:1000px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        padding:48px; display:flex; flex-direction:column; }
  .eyebrow{ font-size:15px; font-weight:800; letter-spacing:.28em; color:var(--mut); text-align:center; }
  h2{ font-size:52px; font-weight:800; letter-spacing:-.026em; line-height:1.02; text-align:center; margin-top:12px; }
  h2 em{ font-style:normal; color:var(--amber); }
  .lede{ text-align:center; font-size:21px; font-weight:600; color:var(--mut); margin-top:14px; line-height:1.4; }
  .sheet{ border:1.5px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;
          box-shadow:0 10px 26px rgba(27,42,65,.16); }
  .sheet img{ width:100%; display:block; }
  .badges{ display:flex; justify-content:center; gap:13px; margin-top:auto; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:11px 25px; font-size:19px; font-weight:800; }
  .bd.fill{ background:var(--navy); color:#fff; }
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px;flex:1;align-content:center}
.bt{font-size:14px;font-weight:800;letter-spacing:.07em;text-align:center;margin-top:12px}
.bdz{font-size:13.5px;color:var(--mut);text-align:center;margin-top:5px;line-height:1.4}</style></head><body><div class="eyebrow">INCLUDED, NOT UPSOLD</div><h2>4 bonuses <em>that get used</em></h2>
<div class="bg"><div><div class="sheet"><img src="../exports/bonus1-preview.png"></div><div class="bt">DOSE WEEK TRACKER</div><div class="bdz">One sheet per dose increase</div></div><div><div class="sheet"><img src="../exports/bonus2-preview.png"></div><div class="bt">DAILY PROTEIN CARD</div><div class="bdz">Two cut-apart cards per page</div></div><div><div class="sheet"><img src="../exports/bonus3-preview.png"></div><div class="bt">GROCERY LIST</div><div class="bdz">Sorted by protein per 100 ml</div></div><div><div class="sheet"><img src="../exports/bonus4-preview.png"></div><div class="bt">AVERSION SWAPS</div><div class="bdz">For when protein itself turns</div></div></div><div class="badges"><span class="bd fill">ALL 4 INCLUDED</span></div></body></html>
