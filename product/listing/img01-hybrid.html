<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Listing 1</title><style>
  :root{ --navy:#1B2A41; --amber:#E09F3E; --green:#4A7C59; --red:#C0453A; --line:#DDE1E8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ width:1000px; height:1000px; background:#fff; color:var(--navy); overflow:hidden;
        font-family:"Inter","Inter Display",sans-serif; -webkit-font-smoothing:antialiased;
        padding:40px 48px 40px; display:flex; flex-direction:column; justify-content:center; }
  h1{ font-size:70px; font-weight:800; line-height:.97; letter-spacing:-.028em; text-align:center; }
  .kick{ text-align:center; font-size:27px; font-weight:700; color:var(--amber); margin-top:13px; font-style:italic; }
  .cmp{ display:flex; align-items:center; justify-content:center; gap:22px; margin-top:20px; }
  .cbx{ width:224px; border-radius:14px; padding:14px 0 16px; text-align:center; }
  .off{ background:#F1F2F4; border:2.5px solid #D8DBE0; }
  .on{ background:#fff; border:3px solid var(--amber); }
  .mk{ font-size:30px; font-weight:800; line-height:1; }
  .mk.x{ color:var(--red); } .mk.v{ color:var(--green); }
  .cl{ font-size:25px; font-weight:800; letter-spacing:-.01em; margin-top:7px; }
  .off .cl{ color:#8A919C; }
  .arr{ font-size:40px; font-weight:800; color:var(--navy); }
  .name{ text-align:center; margin-top:22px; }
  .nm1{ font-size:17px; font-weight:800; letter-spacing:.26em; color:#8A919C; }
  .nm2{ font-size:40px; font-weight:800; letter-spacing:-.022em; margin-top:7px; line-height:1.05; }
  .pages{ display:flex; justify-content:center; align-items:flex-end; gap:13px; margin-top:30px; }
  .pg{ width:186px; border:1.5px solid var(--line); border-radius:7px; overflow:hidden;
       box-shadow:0 7px 18px rgba(27,42,65,.13); background:#fff; }
  .pg img{ width:100%; display:block; }
  .pg.mid{ width:218px; box-shadow:0 11px 26px rgba(27,42,65,.19); }
  .plabels{ text-align:center; font-size:14px; font-weight:800; letter-spacing:.1em;
             color:#8A919C; margin-top:16px; }
  .badges{ display:flex; justify-content:center; gap:13px; margin-top:30px; }
  .bd{ border:2.5px solid var(--navy); border-radius:999px; padding:11px 25px;
       font-size:19px; font-weight:800; letter-spacing:.03em; }
  .bd.fill{ background:var(--navy); color:#fff; }
</style></head><body>
  <h1>MOST GLP-1 MEAL PLANS<br>FILL YOU UP FIRST</h1>
  <div class="kick">Your stomach can't afford that.</div>
  <div class="cmp">
    <div class="cbx off"><div class="mk x">&#10007;</div><div class="cl">FIBER FIRST</div></div>
    <div class="arr">&rarr;</div>
    <div class="cbx on"><div class="mk v">&#10003;</div><div class="cl">PROTEIN FIRST</div></div>
  </div>
  <div class="name">
    <div class="nm1">GLP-1</div>
    <div class="nm2">Low Appetite Protein Plan</div>
  </div>
  <div class="pages">
    <div class="pg"><img src="../exports/p1-start.png"></div>
    <div class="pg"><img src="../exports/p3-density.png"></div>
    <div class="pg mid"><img src="../exports/p2-today.png"></div>
    <div class="pg"><img src="../exports/p4-doseweek.png"></div>
    <div class="pg"><img src="../exports/p5-ladder.png"></div>
  </div>
  <div class="plabels">START HERE &nbsp;&middot;&nbsp; DENSITY &nbsp;&middot;&nbsp; WHAT TO EAT TODAY &nbsp;&middot;&nbsp; DOSE WEEK &nbsp;&middot;&nbsp; TEXTURE LADDER</div>
  <div class="badges">
    <span class="bd fill">10 PAGES</span>
    <span class="bd">A4 + US LETTER</span>
    <span class="bd">INSTANT PDF</span>
  </div>
</body></html>
